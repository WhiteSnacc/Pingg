<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Pingg!</title>
    <link rel="stylesheet" href="signin.css">
    <script src="signin.js"></script>
</head>
<body>
    <form>
        <h1>SIGN IN</h1>
        <p>Selamat Datang di Pingg!<br>Mohon isi form untuk masuk ke dalam website!</p>
        <label for="nama">Nama: </label>
        <input type="text" id="nama" placeholder="Masukkan nama anda.."><br>

        <label for="email">Email: </label>
        <input type="email" id="email" placeholder="Masukkan email anda.."><br>

        <label for="password">Password: </label>
        <input type="password" id="password" placeholder="Masukkan password anda.."><br>

        <input type="submit" value="Sign In" id="submit">
        <p>Sudah punya akun? <a href="login.html">Log In</a></p>
    </form>
</body>
</html>
